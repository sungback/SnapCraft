name: Build macOS & Windows Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop & install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Run static analysis & widget tests
        run: |
          flutter analyze
          flutter test

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS .zip and .dmg
        run: |
          APP_PATH="build/macos/Build/Products/Release/snap_craft.app"
          codesign --force --deep --entitlements macos/Runner/Release.entitlements --sign - "$APP_PATH"
          mkdir -p dist dmg_staging
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/SnapCraft-macOS.zip
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "SnapCraft" -srcfolder dmg_staging -ov -format UDZO dist/SnapCraft-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapCraft-macOS
          path: |
            dist/SnapCraft-macOS.dmg
            dist/SnapCraft-macOS.zip

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SnapCraft-macOS.dmg
            dist/SnapCraft-macOS.zip

  build-windows:
    name: Build Windows (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop & install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Release (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/SnapCraft-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapCraft-Windows-x64
          path: dist/SnapCraft-Windows-x64.zip

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SnapCraft-Windows-x64.zip
