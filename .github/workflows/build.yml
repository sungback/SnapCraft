name: Build & Auto-Release (macOS & Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          APP_VER="${RAW_VER%%+*}"
          BUILD_NUM="${RAW_VER#*+}"
          if [ "$BUILD_NUM" = "$RAW_VER" ]; then BUILD_NUM="1"; fi
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Enable macOS desktop & install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS Release (arm64 only)
        run: |
          flutter build macos --release \
            --build-name=${{ steps.version.outputs.app_version }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Package macOS .zip and .dmg in parallel
        run: |
          APP_PATH="build/macos/Build/Products/Release/snap_craft.app"
          codesign --force --deep --entitlements macos/Runner/Release.entitlements --sign - "$APP_PATH"
          mkdir -p dist dmg_staging
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/SnapCraft-macOS.zip &
          (
            cp -R "$APP_PATH" dmg_staging/
            ln -s /Applications dmg_staging/Applications
            hdiutil create -volname "SnapCraft" -srcfolder dmg_staging -ov -format ULFO dist/SnapCraft-macOS.dmg
          ) &
          wait

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapCraft-macOS
          compression-level: 0
          path: |
            dist/SnapCraft-macOS.dmg
            dist/SnapCraft-macOS.zip

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s#]+)').Matches.Groups[1].Value.Trim()
          $parts = $line -split '\+'
          $appVer = $parts[0]
          $buildNum = if ($parts.Length -gt 1) { $parts[1] } else { "1" }
          "app_version=$appVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_number=$buildNum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Enable Windows desktop & install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows Release
        run: |
          flutter build windows --release --build-name=${{ steps.version.outputs.app_version }} --build-number=${{ steps.version.outputs.build_number }} --dart-define=APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Package Windows Release (.zip via 7-Zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          7z a -tzip -mx=3 "dist/SnapCraft-Windows-x64.zip" "./build/windows/x64/runner/Release/*"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapCraft-Windows-x64
          compression-level: 0
          path: dist/SnapCraft-Windows-x64.zip

  publish-release:
    name: Auto-Publish GitHub Release
    needs: [build-macos, build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check target version & existing release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          APP_VER="${RAW_VER%%+*}"
          TAG_NAME="v$APP_VER"
          echo "app_version=$APP_VER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping release creation."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $TAG_NAME detected in pubspec.yaml! Will create release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built artifacts
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release with macOS & Windows installers
        if: steps.check_release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag_name }}
          name: SnapCraft ${{ steps.check_release.outputs.tag_name }}
          generate_release_notes: true
          files: |
            release_assets/SnapCraft-macOS.dmg
            release_assets/SnapCraft-macOS.zip
            release_assets/SnapCraft-Windows-x64.zip
